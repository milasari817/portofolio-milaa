<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Portofolio Pribadi</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS Pribadi -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="halaman-awal">

    <!-- Dekorasi latar belakang -->
    <div class="lingkaran dekorasi-satu"></div>
    <div class="lingkaran dekorasi-dua"></div>

    <main class="container halaman-login">

        <div class="row justify-content-center align-items-center w-100">

            <div class="col-12 col-md-7 col-lg-5">

                <div class="kartu-login">

                    <div class="ikon-login">🔐</div>

                    <h2>Login Portofolio</h2>

                    <p class="deskripsi-login">
                        Silakan masukkan username dan password
                        untuk masuk ke portofolio saya.
                    </p>

                    <!-- Form Login -->
                    <form id="formLogin">

                        <div class="mb-3 text-start">

                            <label for="username" class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                placeholder="Masukkan username"
                                autocomplete="username"
                            >

                        </div>

                        <div class="mb-3 text-start">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Masukkan password"
                                autocomplete="current-password"
                            >

                        </div>

                        <!-- Pesan Konfirmasi -->
                        <div
                            id="pesanLogin"
                            class="pesan-login"
                            role="alert"
                            aria-live="polite">
                        </div>

                        <!-- Tombol Masuk -->
                        <button type="submit" class="tombol-login">
                            Masuk Portofolio →
                        </button>

                    </form>

                    <!-- Kembali ke Halaman Awal -->
                    <a href="index.html" class="kembali-login">
                        ← Kembali ke Halaman Awal
                    </a>

                </div>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer-awal">
        &copy; <span id="tahun"></span> Portofolio Pribadi Milasari
    </footer>

    <!-- JavaScript -->
    <script src="portofolio.js"></script>
    <script src="login.js"></script>

</body>
</html>
